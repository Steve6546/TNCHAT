packages:
  - "server"
  - "web"

# pnpm catalogs — one source of truth for every dependency version used in
# more than one workspace package. Declare it in a package.json as
# `"typescript": "catalog:"` so the two workspaces can never drift apart.
# Requires pnpm >= 9.5.
catalog:
  typescript: ^5.9.2

# drizzle-orm declares every driver it supports as an *optional* peer, and
# pnpm resolves them anyway. better-sqlite3 is one of them — a native module
# this project stopped using when the data layer moved to Supabase Postgres
# via postgres-js. Nothing imports it, so its build script is skipped: that
# removes a compiler-toolchain dependency from every clean install without
# changing resolution.
ignoredBuiltDependencies:
  - better-sqlite3
